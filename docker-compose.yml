services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: zihome-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zihome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zihome_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zihome}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zihome} -d ${POSTGRES_DB:-zihome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: docker.arvancloud.ir/adminer:4
    container_name: zihome-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
